# .github/workflows/intraday-crash-check-v33.yml
#
# 3:45pm ET EMERGENCY-ONLY check for v3.3. Fired by cron-job.org repository_dispatch.
# It stages (and emails) ONLY when the -8%/3-session trigger trips -- never a routine
# rebalance (that is the 5pm stage-order-v33 job's responsibility). Same-close exit:
# approve & submit before the bell. If this misses, the 5pm close-based check backstops.
name: v3.3 intraday crash check (3:45pm ET)

on:
  repository_dispatch:
    types: [intraday-crash-check]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      VEHICLE:             TQQQ
      TRACK:               v33
      TARGET_VOL:          "0.25"
      LEVERAGE_CAP:        "3.0"
      APCA_API_KEY_ID:     ${{ secrets.APCA_API_KEY_ID_V33 }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY_V33 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pandas

      - name: Intraday crash check (writes EMERGENCY_FIRED only if the trigger trips)
        run: python intraday_crash_check.py | tee intraday_output.txt

      - name: Stage the exit -- ONLY when fired (never a routine rebalance)
        if: ${{ hashFiles('EMERGENCY_FIRED') != '' }}
        run: |
          set -o pipefail
          python stage_order.py | tee stage_output.txt

      - name: Commit proposal + emergency state -- ONLY when fired
        if: ${{ hashFiles('EMERGENCY_FIRED') != '' }}
        run: |
          git config user.name  "fragility-bot"
          git config user.email "actions@users.noreply.github.com"
          git add emergency.json emergency_state.json 2>/dev/null || true
          git add pending_order_${TRACK}.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "v3.3 EMERGENCY EXIT staged $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          else
            echo "No change."
          fi

      - name: Fail the run so you get the email -- ONLY when an exit is staged
        if: ${{ hashFiles('EMERGENCY_FIRED') != '' }}
        run: |
          echo "### v3.3 EMERGENCY EXIT staged -- approve & submit BEFORE the close" >> "$GITHUB_STEP_SUMMARY"
          echo '```'               >> "$GITHUB_STEP_SUMMARY"
          cat stage_output.txt     >> "$GITHUB_STEP_SUMMARY"
          echo '```'               >> "$GITHUB_STEP_SUMMARY"
          exit 1
