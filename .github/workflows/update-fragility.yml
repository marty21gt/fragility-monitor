name: Update Fragility Data

# Runs automatically at 22:00 UTC on weekdays -- that's 5pm ET in winter / 6pm ET in
# summer, safely after the 4pm ET close, so it captures each trading day's closing price.
# Also runs whenever you click "Run workflow" manually.
#
# NOTE: if the freshness gate in fetch_and_build.py starts failing runs because
# Yahoo hasn't posted the day's ^NDX bar yet (it can lag an hour or two after the
# close), give the feed more time by moving the schedule later -- e.g. change the
# cron to "0 1 * * 2-6" (01:00 UTC, ~9pm ET the same trading day). The gate makes
# a too-early run fail loudly instead of publishing stale data, and a re-run once
# the feed catches up will pass.
on:
  # PRIMARY trigger: cron-job.org POSTs a repository_dispatch (see run-pipeline).
  # The schedule below is only a BACKUP (off the hour). Either one starts the chain.
  repository_dispatch:
    types: [run-pipeline]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the tools it needs
        run: pip install pandas numpy requests openpyxl yfinance

      - name: Build data.json
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fetch_and_build.py

      - name: Seal monitor signals
        run: |
          pip install cryptography
          python seal_current.py data.json
        env:
          MONITOR_PASSPHRASE: ${{ secrets.MONITOR_PASSPHRASE }}
       
      - name: Publish the updated data
        run: |
          git config user.name "fragility-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json analysis.json
          git diff --staged --quiet && { echo "No changes to publish."; exit 0; }
          git commit -m "Update fragility data $(date -u +%Y-%m-%d)"
          git pull --rebase origin main    # concurrency-safe: another job may have pushed
          git push
