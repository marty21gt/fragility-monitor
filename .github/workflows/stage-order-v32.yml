# .github/workflows/stage-order-v32.yml
#
# STAGE step -- runs automatically after the daily signal, computes the
# rebalance the model wants, and commits it as pending_order_${TRACK}.json for
# your review. It SUBMITS NOTHING. A green run means "nothing to do today"; a
# red run means "your attention is needed" -- open it to see whether it's a
# staged trade to approve or a stale-data warning. Keys are PAPER keys; the
# code is locked to the paper endpoint and cannot touch real money.

name: Stage rebalance order (v3.2 hot)

on:
  workflow_run:
    workflows: ["Daily VT live"]           # fires when the daily V/T step finishes
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    # only proceed if the upstream succeeded (or this is a manual run)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      VEHICLE:             TQQQ
      TRACK:               v32
      TARGET_VOL:          "0.25"
      LEVERAGE_CAP:        "3.0"
      APCA_API_KEY_ID:     ${{ secrets.APCA_API_KEY_ID_V32 }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY_V32 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas

      - name: Compute the proposal
        run: |
          set -o pipefail
          python stage_order.py | tee stage_output.txt

      - name: Sync the proposal to the repo
        run: |
          git config user.name  "fragility-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pending_order_${TRACK}.json || true          # stages a new proposal OR its removal
          if git diff --staged --quiet; then
            echo "No change to proposal state."
            exit 0
          fi
          git commit -m "Update rebalance proposal (v3.2) $(date -u +%Y-%m-%d)"
          # RACE FIX: the v3.1/v3.2/v3.3 stage jobs all fire off the same "Daily VT live"
          # run and push to the same branch. A single pull-then-push loses whenever another
          # track pushes in the gap between them (rejected: "fetch first"). Retry with a
          # rebase and jittered backoff so the tracks interleave instead of colliding.
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push race lost (attempt $attempt) -- rebasing and retrying"
            sleep $(( (RANDOM % 7) + 3 ))
          done
          echo "ERROR: could not push after 6 attempts"
          exit 1

      - name: Flag if action is needed
        if: always()   # run even if the push above failed, so the trade still gets reported
        run: |
          if [ -f pending_order_${TRACK}.json ]; then
            echo "### Rebalance proposed -- review and approve" >> "$GITHUB_STEP_SUMMARY"
            echo '```'                                          >> "$GITHUB_STEP_SUMMARY"
            cat stage_output.txt                                >> "$GITHUB_STEP_SUMMARY"
            echo '```'                                          >> "$GITHUB_STEP_SUMMARY"
            echo "A trade is staged. Review it, then run the 'Approve & submit order' workflow."
            exit 1     # deliberate: turns the run red so GitHub emails you that action is needed
          else
            echo "No trade needed today."
          fi
