name: v3.3 intraday crash check (3:45pm ET)
# Fires ~15 min before the close so an emergency exit can be approved & submitted
# same-session. Triggered by cron-job.org POSTing a repository_dispatch at 3:45 ET
# (America/New_York, weekdays). Manual run available for testing.
on:
  repository_dispatch:
    types: [intraday-crash-check]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install numpy pandas
      - name: Intraday crash check
        env:
          APCA_API_KEY_ID:     ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python intraday_crash_check.py
      - name: Commit state + proposal
        run: |
          git config user.name  "v33-bot"
          git config user.email "actions@users.noreply.github.com"
          git add emergency.json proposal.json 2>/dev/null || true
          git commit -m "v3.3 intraday check $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git push || echo "nothing to push"
      - name: Red-flag email (only when an exit was staged)
        if: ${{ hashFiles('RED_FLAG') != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "v3.3 EMERGENCY EXIT staged — approve before the close"
          to: ${{ secrets.MAIL_TO }}
          from: Modern Edge v3.3
          body: file://RED_FLAG
